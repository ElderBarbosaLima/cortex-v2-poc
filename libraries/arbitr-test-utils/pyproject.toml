[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbitr-test-utils"
version = "0.1.0"
requires-python = ">=3.12"
description = "Shared test hermeticity, SQLite savepoints, and isolation utilities for Arbitr services."
dependencies = [
    "pytest>=7.0.0",
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0.31",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arbitr_test_utils = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = [
    "fresh_db: provision a dedicated unshared SQLite engine for this test instead of savepoints",
    "allow_network: temporarily permit outbound network connections for this test",
    "integration: mark test as requiring real external services or network",
]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
