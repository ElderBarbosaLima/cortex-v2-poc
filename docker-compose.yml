# Cortex v2 PoC. Always driven through `make` (make help).
# The stack is ephemeral (docs/discovery.md 9.2, Q4): `make stop` removes
# containers AND volumes. Host ports bind to 127.0.0.1 only.
name: cortex-poc

x-org-brain-db-env: &org-brain-db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: org_brain
  ORG_BRAIN_APP_USER: org_brain_app
  ORG_BRAIN_APP_PASSWORD: ${ORG_BRAIN_APP_PASSWORD:?set it in .env (make init-env)}
  ORG_BRAIN_OWNER_USER: org_brain_owner
  ORG_BRAIN_OWNER_PASSWORD: ${ORG_BRAIN_OWNER_PASSWORD:?set it in .env (make init-env)}

# Every AWS client (probe, terraform, later org-brain) uses the normal SDK,
# configured only by these variables (docs/discovery.md 3.2). They join the
# emulator's network namespace (network_mode: service:aws-emulator) and reach
# it on 127.0.0.1, the only host its certificate and S3 handling are
# documented for. Credentials, config and CA are regenerated on every start
# and read from the shared volume, never copied into .env or code.
x-aws-client-env: &aws-client-env
  AWS_ENDPOINT_URL: https://127.0.0.1:9297
  AWS_CA_BUNDLE: /home/emulator/.aws/emulator/9297/ca.pem
  AWS_SHARED_CREDENTIALS_FILE: /home/emulator/.aws/emulator/9297/emulator_credentials
  AWS_CONFIG_FILE: /home/emulator/.aws/emulator/9297/config
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_DISABLE_HOST_PREFIX_INJECTION: "true"

services:
  aws-emulator:
    build:
      context: infra/aws-emulator
    image: cortex-poc/aws-emulator:1.0.545
    environment:
      EMULATOR_TELEMETRY: "off"
    mem_limit: 2g
    memswap_limit: 2g
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator
    ports:
      - "127.0.0.1:9297:9297"
      # org-brain-service shares this network namespace (AWS clients reach the
      # emulator on 127.0.0.1), so its port is published here.
      - "127.0.0.1:${ORG_BRAIN_SERVICE_PORT:-5008}:5008"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/home/emulator/.aws/emulator/9297/ca.pem", "https://127.0.0.1:9297/__admin/health"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - cortex

  # One-shot: builds policies/ into a bundle whose revision is a content hash.
  # Uses the official -debug variant only because it has a shell and sha256sum.
  opa-bundle:
    image: openpolicyagent/opa:1.22.4-debug@sha256:bc5909a9ee68feaac292690909361ec489383dad61e72e5c7e84696fab041977
    user: "0"
    entrypoint: ["sh", "/build/build-bundle.sh"]
    network_mode: none
    volumes:
      - ./policies:/policies:ro
      - ./infra/opa:/build:ro
      - opa-bundle:/bundles

  # Authorisation for the access gate and approvals (D22). The official,
  # distroless image: the healthcheck uses OPA itself (http.send against its
  # own /health?bundles), so it needs no shell or curl.
  opa:
    image: openpolicyagent/opa:1.22.4@sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --log-format=json
      - --log-level=info
      - --bundle
      - /bundles/cortex.tar.gz
    depends_on:
      opa-bundle:
        condition: service_completed_successfully
    volumes:
      - opa-bundle:/bundles:ro
    ports:
      - "127.0.0.1:${CORTEX_OPA_PORT:-8181}:8181"
    healthcheck:
      test:
        - CMD
        - /opa
        - eval
        - --fail
        - 'http.send({"method": "get", "url": "http://127.0.0.1:8181/health?bundles", "timeout": "2s"}).status_code == 200'
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - cortex

  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: cortex-poc/postgres:16-pgvector0.8.7-bigm1.2.20250903
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (make init-env)}
      ORG_BRAIN_OWNER_PASSWORD: ${ORG_BRAIN_OWNER_PASSWORD:?set it in .env (make init-env)}
      ORG_BRAIN_APP_PASSWORD: ${ORG_BRAIN_APP_PASSWORD:?set it in .env (make init-env)}
    ports:
      - "127.0.0.1:${CORTEX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # TCP on purpose: during first-boot init the server listens on the unix
      # socket only, so a socket check would report healthy before the init
      # scripts (roles, extensions) have run.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "org_brain"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - cortex

  # One-shot: `alembic upgrade head` as the table owner before the service
  # starts (the deploy init-container pattern). The service never migrates.
  org-brain-migrate:
    image: cortex-poc/org-brain-service:dev
    environment:
      <<: *org-brain-db-env
    command: ["pipenv", "run", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cortex

  # Drains the outbox into the search projection (issue 10). A separate process,
  # so a projection can lag the ledger; tests drain explicitly instead.
  org-brain-projector:
    image: cortex-poc/org-brain-service:dev
    environment:
      <<: [*org-brain-db-env, *aws-client-env]
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    command: ["pipenv", "run", "python", "-m", "app.workers.projector"]
    # Opens sealed bodies (KMS data keys), so it is an AWS client too.
    network_mode: service:aws-emulator
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator:ro
    depends_on:
      aws-emulator:
        condition: service_healthy
        restart: true
      org-brain-migrate:
        condition: service_completed_successfully

  org-brain-service:
    build:
      context: .
      dockerfile: services/org-brain-service/Dockerfile
      target: runtime
    image: cortex-poc/org-brain-service:dev
    env_file:
      - path: .env
        required: false
    environment:
      <<: [*org-brain-db-env, *aws-client-env]
      SERVICE_NAME: org-brain-service
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OPA_URL: http://opa:8181
      SEED_DIR: /data/synthetic
    # An AWS client: it reaches the emulator on 127.0.0.1 (the certificate's
    # only names), reading the emulator's CA and rotating keys read-only.
    network_mode: service:aws-emulator
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator:ro
      - ./data:/data:ro
    depends_on:
      aws-emulator:
        condition: service_healthy
        restart: true
      opa:
        condition: service_healthy
      org-brain-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5008/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── tools (profile "tools": never started by `make dev`) ──────────────────

  # Unit tests, lint and typecheck. No network at all: the hermetic rule is
  # enforced by the container as well as by the socket guard.
  org-brain-dev:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: services/org-brain-service/Dockerfile
      target: dev
    image: cortex-poc/org-brain-service:dev-tools
    network_mode: none
    volumes:
      - ./services/org-brain-service:/app
      - ./libraries:/libraries
      # Read-only: tests compare the committed synthetic data with a fresh run.
      - ./data:/data:ro

  # `make gen-data`: writes data/synthetic/ (deterministic, no network).
  synthetic:
    profiles: ["tools"]
    image: cortex-poc/org-brain-service:dev-tools
    network_mode: none
    volumes:
      - ./services/org-brain-service:/app
      - ./libraries:/libraries
      - ./data:/data
    command: ["pipenv", "run", "python", "-m", "app.cli.gen_synthetic", "--out", "/data/synthetic"]

  # `make probe-emulator`: fidelity probe of every AWS operation the PoC uses.
  # Writes docs/emulator-probe-<version>.md and exits non-zero if a required
  # operation is missing (issue 3 gate).
  aws-probe:
    profiles: ["tools"]
    image: cortex-poc/org-brain-service:dev-tools
    network_mode: service:aws-emulator
    depends_on:
      aws-emulator:
        condition: service_healthy
    environment:
      <<: *aws-client-env
      EMULATOR_VERSION: "1.0.545"
      EMULATOR_SHA256_ARM64: d1082db735e385a363ef9983a72f419fdb2e113e0a6917357b0fb027ba2388d6
      EMULATOR_SHA256_AMD64: c2459541d26a982239be74d38118bc87cc016907be4c055d8d12d72f575cb001
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator:ro
      - ./services/org-brain-service:/app
      - ./libraries:/libraries
      - ./docs:/docs
    command: ["pipenv", "run", "python", "scripts/aws_probe.py", "--out-dir", "/docs"]

  # `make provision` / `make tf-plan`: Terraform against the emulator (Rev. C:
  # "cloud differences live only in this module"). Shares the emulator's
  # network namespace like every AWS client. State lives on a volume that
  # `make stop` removes with the emulator; the provider plugin cache is an
  # external volume so the provider is not downloaded on every `make dev`.
  terraform:
    profiles: ["tools"]
    image: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
    entrypoint: ["sh", "/workspace/infra/terraform/provision.sh"]
    network_mode: service:aws-emulator
    depends_on:
      aws-emulator:
        condition: service_healthy
    environment:
      <<: *aws-client-env
      TF_IN_AUTOMATION: "1"
      TF_DATA_DIR: /state/.terraform
      TF_PLUGIN_CACHE_DIR: /plugins
      TF_VAR_consumer_api_keys: ${CORTEX_DEV_API_KEYS:?set it in .env (make init-env)}
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator:ro
      - ./infra:/workspace/infra
      - terraform-state:/state
      - terraform-plugins:/plugins

  # `make tf-lock`: provider hashes for linux_arm64 and linux_amd64.
  terraform-lock:
    profiles: ["tools"]
    image: hashicorp/terraform:1.17.2@sha256:6e9c1e647c31a960dc9b59e13272f9111d90010c10b717f77ffb324767660475
    working_dir: /workspace/infra/terraform/aws
    command: ["providers", "lock", "-platform=linux_arm64", "-platform=linux_amd64"]
    volumes:
      - ./infra:/workspace/infra

  # `opa test` and `opa check --strict` on policies/ (make test-policies, make lint).
  opa-tools:
    profiles: ["tools"]
    image: openpolicyagent/opa:1.22.4@sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf
    network_mode: none
    volumes:
      - ./policies:/policies:ro

  # Regal, the Rego linter (make lint).
  regal:
    profiles: ["tools"]
    image: ghcr.io/open-policy-agent/regal:0.43.0@sha256:29460f0ec1340d37f6c0c74bcbd88dd232fd8382c7a2337f0684415bd4c46da1
    network_mode: none
    working_dir: /policies
    volumes:
      - ./policies:/policies:ro

  # `make contract`: TypeScript types from the API spec (openapi-typescript, pinned).
  contract-ts:
    profiles: ["tools"]
    image: node:22.12.0-slim@sha256:35531c52ce27b6575d69755c73e65d4468dba93a25644eed56dc12879cae9213
    working_dir: /contract
    environment:
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ./libraries/cortex-contract:/contract

  # `make lock SVC=<service>`: regenerates Pipfile.lock with the pinned pipenv.
  pipenv-lock:
    profiles: ["tools"]
    image: python:3.12.16-slim-trixie
    working_dir: /repo/services/${SVC:-org-brain-service}
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_ROOT_USER_ACTION: ignore
    command: ["sh", "-c", "pip install -q pipenv==2026.10.6 && pipenv lock"]
    volumes:
      - .:/repo

networks:
  cortex:

volumes:
  postgres-data:
  aws-emulator-home:
  opa-bundle:
  terraform-state:
  terraform-plugins:
    # External: survives `make stop` (it is a download cache, not state).
    external: true
    name: cortex-poc-terraform-plugins
