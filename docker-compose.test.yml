# Ephemeral integration-test stack (docs/adr/0001-test-tiers.md).
# Always run as its own compose project:  make test-integration
#   -p cortex-poc-test: never shares containers, networks or volumes with `make dev`
#   no host ports; data on tmpfs; `down -v` after every run.
# The passwords below exist only inside this throwaway stack.
name: cortex-poc-test

x-aws-client-env: &aws-client-env
  AWS_ENDPOINT_URL: https://127.0.0.1:9297
  AWS_CA_BUNDLE: /home/emulator/.aws/emulator/9297/ca.pem
  AWS_SHARED_CREDENTIALS_FILE: /home/emulator/.aws/emulator/9297/emulator_credentials
  AWS_CONFIG_FILE: /home/emulator/.aws/emulator/9297/config
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_DISABLE_HOST_PREFIX_INJECTION: "true"

x-test-db-env: &test-db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: org_brain
  ORG_BRAIN_APP_USER: org_brain_app
  ORG_BRAIN_APP_PASSWORD: test-app
  ORG_BRAIN_OWNER_USER: org_brain_owner
  ORG_BRAIN_OWNER_PASSWORD: test-owner
  POSTGRES_SUPERUSER_PASSWORD: test-superuser

services:
  aws-emulator:
    build:
      context: infra/aws-emulator
    image: cortex-poc/aws-emulator:1.0.545
    environment:
      EMULATOR_TELEMETRY: "off"
    mem_limit: 2g
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--cacert", "/home/emulator/.aws/emulator/9297/ca.pem", "https://127.0.0.1:9297/__admin/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  opa-bundle:
    image: openpolicyagent/opa:1.22.4-debug@sha256:bc5909a9ee68feaac292690909361ec489383dad61e72e5c7e84696fab041977
    user: "0"
    entrypoint: ["sh", "/build/build-bundle.sh"]
    network_mode: none
    volumes:
      - ./policies:/policies:ro
      - ./infra/opa:/build:ro
      - opa-bundle:/bundles

  opa:
    image: openpolicyagent/opa:1.22.4@sha256:ff50f50332ff9e722ffafe2658c195ced1f9b6d4f3064000c2ecfa8cdf7acccf
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--bundle", "/bundles/cortex.tar.gz"]
    depends_on:
      opa-bundle:
        condition: service_completed_successfully
    volumes:
      - opa-bundle:/bundles:ro
    healthcheck:
      test:
        - CMD
        - /opa
        - eval
        - --fail
        - 'http.send({"method": "get", "url": "http://127.0.0.1:8181/health?bundles", "timeout": "2s"}).status_code == 200'
      interval: 2s
      timeout: 5s
      retries: 30

  postgres:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    image: cortex-poc/postgres:16-pgvector0.8.7-bigm1.2.20250903
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-superuser
      ORG_BRAIN_OWNER_PASSWORD: test-owner
      ORG_BRAIN_APP_PASSWORD: test-app
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "org_brain"]
      interval: 2s
      timeout: 3s
      retries: 30

  org-brain-it:
    build:
      context: .
      dockerfile: services/org-brain-service/Dockerfile
      target: dev
    image: cortex-poc/org-brain-service:dev-tools
    environment:
      <<: [*test-db-env, *aws-client-env]
      OPA_URL: http://opa:8181
      SEED_DIR: /data/synthetic
    depends_on:
      postgres:
        condition: service_healthy
      opa:
        condition: service_healthy
      aws-emulator:
        condition: service_healthy
    # KMS through the emulator on 127.0.0.1, like every AWS client.
    network_mode: service:aws-emulator
    volumes:
      - aws-emulator-home:/home/emulator/.aws/emulator:ro
      - ./services/org-brain-service:/app
      - ./libraries:/libraries
      - ./data:/data:ro

volumes:
  opa-bundle:
  aws-emulator-home:
